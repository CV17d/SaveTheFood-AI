[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "savethefood-ai"
version = "0.1.0"
description = "Intelligent food waste mitigation system powered by OCR, RAG, and advanced data structures."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "SaveTheFood Team" },
]
keywords = ["food-waste", "ocr", "rag", "gemini", "streamlit", "clean-architecture"]

dependencies = [
    # ─── Core ─────────────────────────────────────────────
    "streamlit>=1.38.0",
    "plotly>=5.22.0",
    "pillow>=10.4.0",
    # ─── OCR ──────────────────────────────────────────────
    "pytesseract>=0.3.13",
    "opencv-python>=4.10.0.84",
    # ─── AI / RAG ─────────────────────────────────────────
    "google-generativeai>=0.8.0",
    # ─── Database ─────────────────────────────────────────
    "sqlalchemy>=2.0.32",
    # ─── Configuration ────────────────────────────────────
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "black>=24.8.0",
    "faker>=28.0.0",
]

[project.scripts]
savethefood = "src.presentation.app:main"

# ─── Ruff Configuration ──────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ─── MyPy Configuration ──────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["pytesseract.*", "cv2.*", "plotly.*", "streamlit.*"]
ignore_missing_imports = true

# ─── Pytest Configuration ────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (may use DB or external services)",
    "e2e: End-to-end tests (full pipeline)",
]

# ─── Coverage Configuration ──────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "scripts/*", "notebooks/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.hatch.build.targets.wheel]
packages = ["src"]
